[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "teamfight-tactician"
version = "0.2.0"
description = "TFT analytics companion — data pipelines, stats, and insights."
requires-python = ">=3.14"
dependencies = [
    "requests>=2.34,<3",
    "python-dotenv>=1.2,<2",
    "fastapi>=0.141,<1",
    "uvicorn>=0.52,<1",
    "pandas>=3.0,<4",
    "tabulate>=0.10,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "httpx>=0.28,<1",
    "ruff>=0.16,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
tft = ["db/*.sql", "analysis/*.sql", "web/static/*", "web/static/**/*"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
